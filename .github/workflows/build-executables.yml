name: Build executables

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.10.0"

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$(dart run MultiplexorApp/tool/resolve_build_version.dart --tag "$GITHUB_REF_NAME")"
          else
            version="$(dart run MultiplexorApp/tool/resolve_build_version.dart --run-number "$GITHUB_RUN_NUMBER")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-15
            executable: multiplexor
            archive_suffix: macos-arm64.tar.gz
          - name: macOS (Intel)
            runner: macos-15-intel
            executable: multiplexor
            archive_suffix: macos-x64.tar.gz
          - name: Windows (x64)
            runner: windows-latest
            executable: multiplexor.exe
            archive_suffix: windows-x64.zip
    env:
      EXECUTABLE_NAME: ${{ matrix.executable }}
      ARCHIVE_NAME: multiplexor-v${{ needs.version.outputs.version }}-${{ matrix.archive_suffix }}
      BUILD_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.10.0"

      - name: Install dependencies
        working-directory: MultiplexorApp
        run: dart pub get

      - name: Analyze
        working-directory: MultiplexorApp
        run: dart analyze

      - name: Test
        working-directory: MultiplexorApp
        run: dart test

      - name: Compile macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: dart run MultiplexorApp/tool/build_exe.dart --version "$BUILD_VERSION" --output "$RUNNER_TEMP/$EXECUTABLE_NAME"

      - name: Compile Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP $env:EXECUTABLE_NAME
          dart run MultiplexorApp/tool/build_exe.dart --version $env:BUILD_VERSION --output $outputPath

      - name: Smoke-test macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          actual="$("$RUNNER_TEMP/$EXECUTABLE_NAME" version | head -n 1)"
          test "$actual" = "Multiplexor CLI v$BUILD_VERSION"

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP $env:EXECUTABLE_NAME
          $actual = (& $outputPath version | Select-Object -First 1)
          if ($actual -ne "Multiplexor CLI v$env:BUILD_VERSION") {
            throw "Expected Multiplexor CLI v$env:BUILD_VERSION, got $actual"
          }

      - name: Smoke-test Windows create and runtime lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP $env:EXECUTABLE_NAME
          $smokeRoot = Join-Path $env:RUNNER_TEMP "multiplexor-windows-smoke"
          $fakeTools = Join-Path $env:RUNNER_TEMP "multiplexor-fake-tools"
          New-Item -ItemType Directory -Force -Path $fakeTools | Out-Null
          $fakeJavaSource = Join-Path $fakeTools "fake_java.dart"
          @'
          import 'dart:async';
          import 'dart:io';
          Future<void> main(List<String> args) async {
            if (args.contains('--installServer')) {
              final Directory argsDir = Directory('libraries\\fake')..createSync(recursive: true);
              File('${argsDir.path}\\win_args.txt').writeAsStringSync('--launchTarget forge_server');
              File('run.bat').writeAsStringSync('java @libraries\\fake\\win_args.txt %*');
              return;
            }
            stdout.writeln('fake java started');
            await Future<void>.delayed(const Duration(seconds: 8));
          }
          '@ | Set-Content -LiteralPath $fakeJavaSource
          dart compile exe $fakeJavaSource -o (Join-Path $fakeTools "java.exe")
          $env:PATH = "$fakeTools;$env:PATH"
          $env:MULTIPLEXOR_FORCE_WINDOWS_LINK_FALLBACK = "1"
          $jarPath = Join-Path $env:RUNNER_TEMP "fake-server.jar"
          Set-Content -LiteralPath $jarPath -Value "fake server"
          $installerPath = Join-Path $env:RUNNER_TEMP "forge-installer.jar"
          Set-Content -LiteralPath $installerPath -Value "fake installer"

          & $outputPath --root $smokeRoot --consumer forge server create ci-forge --type forge --jar $installerPath
          if ($LASTEXITCODE -ne 0) { throw "Windows Forge installer create failed" }
          $forgeMetadata = Get-Content -Raw -LiteralPath (Join-Path $smokeRoot "consumers\forge-mod-consumers\instances\ci-forge\.server-source")
          if ($forgeMetadata -notmatch "args_file_rel=.*win_args.txt") {
            throw "Windows Forge metadata did not select win_args.txt: $forgeMetadata"
          }
          & $outputPath --root $smokeRoot --consumer forge instance delete ci-forge
          if ($LASTEXITCODE -ne 0) { throw "Windows Forge smoke cleanup failed" }

          & $outputPath --root $smokeRoot server create ci-win --type custom --jar $jarPath
          if ($LASTEXITCODE -ne 0) { throw "Windows server create failed" }
          & $outputPath --root $smokeRoot instance activate ci-win
          if ($LASTEXITCODE -ne 0) { throw "Windows instance activation failed" }
          & $outputPath --root $smokeRoot instance activate ci-win
          if ($LASTEXITCODE -ne 0) { throw "Windows instance re-activation failed" }
          & $outputPath --root $smokeRoot runtime start ci-win --no-console
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime start failed" }
          $status = (& $outputPath --root $smokeRoot runtime status ci-win) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $status -notmatch "Runtime running") {
            throw "Windows runtime status failed: $status"
          }
          $restartScript = Join-Path $smokeRoot "consumers\plugin-consumers\instances\ci-win\multiplexor-restart.cmd"
          & cmd.exe /d /c $restartScript
          if ($LASTEXITCODE -ne 0) { throw "Windows restart worker failed" }
          $restartStatus = (& $outputPath --root $smokeRoot runtime status ci-win) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $restartStatus -notmatch "Runtime running") {
            throw "Windows restarted status failed: $restartStatus"
          }
          & $outputPath --root $smokeRoot runtime stop ci-win
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime stop failed" }
          $stoppedStatus = (& $outputPath --root $smokeRoot runtime status ci-win) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $stoppedStatus -notmatch "Runtime stopped") {
            throw "Windows stopped status failed: $stoppedStatus"
          }
          & $outputPath --root $smokeRoot plugins watch-stop
          if ($LASTEXITCODE -ne 0) { throw "Windows watcher stop failed" }
          $sharedIris = Join-Path $smokeRoot "consumers\plugin-consumers\shared-plugin-data\iris\packs"
          $sharedSentinel = Join-Path $sharedIris "keep.txt"
          Set-Content -LiteralPath $sharedSentinel -Value "preserve shared target"
          & $outputPath --root $smokeRoot instance delete ci-win
          if ($LASTEXITCODE -ne 0) { throw "Windows instance delete failed" }
          if (-not (Test-Path -LiteralPath $sharedSentinel)) {
            throw "Windows junction deletion traversed the shared Iris target"
          }

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf "$RUNNER_TEMP/$ARCHIVE_NAME" -C "$RUNNER_TEMP" "$EXECUTABLE_NAME"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP $env:EXECUTABLE_NAME
          $archivePath = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_NAME
          Compress-Archive -LiteralPath $outputPath -DestinationPath $archivePath -Force

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: multiplexor-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --latest
          fi
